sections: [hero, { key: bookshelf, partial: "landing/sections/bookshelf.html" }, cta]

hero:
  align: center
  # eyebrow: CAI field manuals
  title_lines:
    - words: [{ text: CAI Field Manuals }]
    - words: [{ text: "([red.ht/caifm](https://red.ht/caifm))" }]
  lead: "The shelf for CAI's Field Manuals: An aggregation of all the Field Manuals in a single place."

# Scratch: bookshelf-style nav buttons, one book per field manual. Book width
# is banded by the manual's top-level heading count (see bookshelf.html);
# cover color is spaced by index so books look distinct without real
# randomness.
bookshelf:
  # eyebrow: Pick the one for you!
  title: All Field Manuals on a single shelf!
  items:
    - title: Hello World
      subtitle: General example
      url: hello-world/
      icon: fa-solid fa-seedling
    - title: Migration 2.25 → 3.5
      # subtitle: Getting from 2 to 3
      url: rhoai-2-25-to-3-5/
      icon: fa-solid fa-route
    - title: Inference
      subtitle: (coming soon)
      url: inference/
      icon: fa-solid fa-cloud
    - title: MaaS
      subtitle: Models-as-a-Service
      url: maas/
      icon: fa-solid fa-cloud

cards:
  eyebrow: Structure
  title: What lives here
  columns: 2
  items:
    - title: Hello World Field Manual
      desc: "The blank field-manual skeleton: duplicate it and fill in your own field procedures. From CAI-Field-Manual-Hello-World via git submodule."
      icon: fa-solid fa-seedling
      url: hello-world/
    - title: RHOAI 2.25 → 3.5 migration
      desc: "Migrate Red Hat OpenShift AI 2.25.10 (or later 2.25.z) in place to 3.5 — in the order you do the work, with every step verified and every known break documented where you hit it."
      icon: fa-solid fa-route
      url: rhoai-2-25-to-3-5/
    - title: MaaS
      desc: "MaaS guide: Kustomize manifests with status gates and automation for Models-as-a-Service on OpenShift. From CAI-Field-Manual-MaaS via git submodule."
      icon: fa-solid fa-cloud
      url: maas/
    - title: How to write a manual
      desc: "The six conventions every manual follows and the walkthrough for writing your first one — in the Hello World manual."
      icon: fa-solid fa-pen-ruler
      url: hello-world/what-is-a-field-manual/writing-the-field-manual/
    - title: What is a field manual
      desc: "Who writes these manuals, what they contain, and how to read them as a human or an AI agent."
      icon: fa-solid fa-book-open
      url: hello-world/what-is-a-field-manual/
    - title: Editing any manual
      desc: "Clone, render locally, and pass the publication gate — the shared workflow for every field manual."
      icon: fa-solid fa-pen-nib
      url: hello-world/editing/

cta:
  title: "We want your feedback."
  text: "Report issues here"
  label: Github Issues
  url: https://github.com/rh-aiservices-bu/CAI-Field-Manual-Library/issues
  style: primary

timeline:
  eyebrow: The format
  title: Every manual walks the field-work timeline
  items:
    - date: Phase 1
      icon: fa-solid fa-play
      title: Set up
      desc: One procedure that changes the system — prerequisites, status-gated commands, verification, rollback.
    - date: Phase 2
      icon: fa-solid fa-gauge-high
      title: Operate
      desc: Day-two health checks, drift detection, and when to escalate.
    - date: Phase 3
      icon: fa-solid fa-triangle-exclamation
      title: Things that broke
      desc: Known issues where you hit them — symptom, diagnosis, workaround, tracker id.

faq:
  eyebrow: For readers
  title: Questions people actually ask
  items:
    - question: Why does every command show its expected output?
      answer: A command whose output nobody checks is a guess about the system's state. The status gate turns "ran it" into "confirmed it" — see the Hello World manual's <a href="hello-world/what-is-a-field-manual/definition/">Definition</a> and <a href="hello-world/what-is-a-field-manual/writing-the-field-manual/">Writing the field manual</a> for the full conventions.
    - question: Why do versions and ops modes live in a selector instead of separate pages?
      answer: Divergence is permanent; separate pages fork the manual and drift apart. The selector filters, the choice persists, and the markdown output carries every variant labeled for agents.
